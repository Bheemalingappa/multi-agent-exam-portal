apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: multi-agent-exam
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: multi-agent-exam
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: exam-portal-frontend
  ingress:
    - {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-traffic
  namespace: multi-agent-exam
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: exam-portal-backend
  ingress:
    - {}
  egress:
    - {}
  policyTypes:
    - Ingress
    - Egress
