apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-metrics-monitor
  namespace: multi-agent-exam
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: exam-portal-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
