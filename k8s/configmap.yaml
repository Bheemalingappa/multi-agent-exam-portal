apiVersion: v1
kind: ConfigMap
metadata:
  name: exam-portal-config
  namespace: multi-agent-exam
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  AI_PROVIDER: "deterministic"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  SANDBOX_MEM_LIMIT: "128m"
  SANDBOX_CPU_QUOTA: "0.5"
  SANDBOX_TIMEOUT_SECONDS: "2"
  MAX_A2A_ROUNDS: "3"
  MAX_SOURCE_CODE_BYTES: "100000"
  MAX_OUTPUT_BYTES: "65536"
  MAX_TELEMETRY_EVENTS: "1000"
  CORS_ORIGINS: "https://exam.example.com"
