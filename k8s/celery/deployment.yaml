apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-portal-celery-worker
  namespace: multi-agent-exam
  labels:
    app.kubernetes.io/name: exam-portal-celery-worker
    app.kubernetes.io/component: task-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: exam-portal-celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exam-portal-celery-worker
        app.kubernetes.io/component: task-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: celery-worker
          image: multi-agent-exam-portal-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.pipeline.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
          envFrom:
            - configMapRef:
                name: exam-portal-config
            - secretRef:
                name: exam-portal-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
