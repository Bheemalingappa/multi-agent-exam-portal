name: Security Audit Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit:
    name: Bandit AST & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Security Scanners
        run: pip install bandit

      - name: Run Bandit AST Security Scan
        run: bandit -r backend/app -ll -ii || true

      - name: Verify Secret Scanning (.env excluded)
        run: |
          if [ -f .env ]; then
            echo "::error::.env file detected in Git working tree!"
            exit 1
          fi
