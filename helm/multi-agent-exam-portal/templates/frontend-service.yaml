apiVersion: v1
kind: Service
metadata:
  name: {{ include "multi-agent-exam-portal.fullname" . }}-frontend-service
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app.kubernetes.io/name: {{ include "multi-agent-exam-portal.name" . }}-frontend
