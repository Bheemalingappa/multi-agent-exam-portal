apiVersion: v1
kind: Secret
metadata:
  name: {{ include "multi-agent-exam-portal.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_BROKER_URL: {{ .Values.secrets.redisUrl | quote }}
  REDIS_RESULT_BACKEND: {{ .Values.secrets.redisUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
