global:
  namespace: multi-agent-exam
  environment: production

backend:
  replicaCount: 2
  image:
    repository: multi-agent-exam-portal-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

frontend:
  replicaCount: 2
  image:
    repository: multi-agent-exam-portal-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

celery:
  replicaCount: 2
  image:
    repository: multi-agent-exam-portal-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

ingress:
  enabled: true
  host: exam.example.com
  tlsSecret: exam-portal-tls

config:
  AI_PROVIDER: "deterministic"
  JWT_ALGORITHM: "HS256"
  CORS_ORIGINS: "https://exam.example.com"
  SANDBOX_MEM_LIMIT: "128m"
  SANDBOX_CPU_QUOTA: "0.5"
  SANDBOX_TIMEOUT_SECONDS: "2"
  MAX_A2A_ROUNDS: "3"

secrets:
  databaseUrl: "postgresql://postgres:postgrespassword@postgres-service:5432/exam_portal_db"
  redisUrl: "redis://redis-service:6379/0"
  jwtSecretKey: "dev_secret_key_change_in_production_2026"
  llmApiKey: ""
